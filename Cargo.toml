[package]
name = "aeszippy"
version = "0.0.3"
edition = "2021"
description = "Pure-Rust AES-256 encrypt/decrypt for 7z archives. Part of the 7-zippy family."
license = "Zlib"
repository = "https://github.com/JackDanger/aeszippy"
authors = ["Jack Danger Canty"]
build = "build.rs"

[dependencies]
thiserror = "1"
# RustCrypto backend for AES-256-CBC and SHA-256 KDF (7z spec).
aes = "0.8"
sha2 = "0.10"
cbc = { version = "0.1", features = ["std"] }
cipher = "0.4"
# Random IV generation for AES encryption.
getrandom = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decrypt"
harness = false
